# The full gate on every pull request and on main, on Linux, Windows and macOS, so a green result doesn't depend on the
# author's machine or on hooks that `--no-verify` skips. macOS is where a write to a pipe can finish after the command
# exits, so the tests that read a report through a slow pipe fail only there. For a pull request, also what it changed in the checks that judge it
# (guard-diff), which guard-report.yml posts on the pull request.
name: Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full gate (${{ matrix.os }})
    strategy:
      # One platform failing doesn't hide how the other did.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Nothing here pushes, and the gate runs the pull request's code: it gets no token to read in .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs: without this Electron
      # exits before Tally's first journey opens a window.
      - name: Let Electron's sandbox start
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Full gate
        # Electron needs a display: xvfb-run gives it one on Linux, and Windows has its own.
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}npm run gate:full
        env:
          # A cold runner builds and starts Electron more slowly than a laptop.
          PROBE_TIMEOUT_MS: "600000"
      - name: Keep the gate's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-${{ matrix.os }}
          path: |
            .verify/
            examples/tally/.verify/
          include-hidden-files: true
          if-no-files-found: ignore

  # The workflows themselves, which no gate stage can run: actionlint for what GitHub would reject or misread (an
  # expression, a condition, a job's needs), zizmor for what lets a pull request's code reach a token or a write.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: zizmor
        run: pipx run zizmor==1.5.2 --format plain .github/workflows

  # This job runs the pull request's code, so it gets a read-only token, and checkout keeps no credentials for that code
  # to read. It reports to the run's summary and leaves its output as an artifact; guard-report.yml, which runs from the
  # base branch's definition and never runs this code, posts it on the pull request.
  guard-diff:
    name: Guard changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch's history, for the merge base.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare the guards with the base branch
        # pipefail: guard-diff failing fails the step, rather than tee's success standing for it. A fresh checkout has
        # no core.hooksPath, so the hooks folder is named.
        shell: bash
        run: |
          set -o pipefail
          node packages/marram/bin/marram.mjs guard-diff "origin/$BASE" --map examples/tally/docs/feature-map.md --hooks .githooks | tee guard-diff.txt
        env:
          BASE: ${{ github.base_ref }}
      - name: Say that it failed
        if: failure()
        run: |
          printf 'guard-diff failed, so the guard changes are unknown: see the "Guard changes" job in the run.\n' > guard-diff.txt
      - name: Show them in the run's summary
        # Not when the run was cancelled, which leaves nothing to report.
        if: success() || failure()
        run: .github/scripts/guard-diff-report.sh summary guard-diff.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Leave them for the comment
        # Not when the run was cancelled, which leaves nothing to report.
        if: success() || failure()
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir guard-report
          cp guard-diff.txt guard-report/
          printf '%s\n' "$PR" > guard-report/pr
      - uses: actions/upload-artifact@v4
        # Not when the run was cancelled, which leaves nothing to report.
        if: success() || failure()
        with:
          name: guard-report
          path: guard-report/
          retention-days: 3

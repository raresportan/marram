# Posts the Gate run's guard-diff on its pull request: one comment, edited on each run. It runs from the default
# branch's definition (workflow_run), never the pull request's, so the write token here is out of that code's reach:
# this job checks out only the default branch's report script, and treats the artifact the run left as text.
name: Guard report

on:
  workflow_run:
    workflows: [Gate]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    name: Comment on the pull request
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        # A run cancelled before guard-diff left nothing to post.
        continue-on-error: true
        id: download
        with:
          name: guard-report
          path: guard-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post it
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The number came from the run, so it's checked: that pull request's head must be the commit the run judged.
          pr=$(head -c 16 guard-report/pr | tr -cd '0-9')
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [[ -z $pr || $head != "$HEAD_SHA" ]]; then
            echo "Pull request #$pr's head is $head, not $HEAD_SHA, the commit this run judged: nothing posted."
            exit 0
          fi
          PR=$pr .github/scripts/guard-diff-report.sh comment guard-report/guard-diff.txt

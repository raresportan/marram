\* Three processes, two rounds each, any of them pausing anywhere or dying anywhere.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2, p3}
    MaxGen = 10
    Rounds = 2
    VerifyAfterPublish = TRUE
INVARIANT TypeOK
INVARIANT Mutex
\* Numbers grow as processes give way and die; the search stops at MaxGen, and Mutex holds everywhere below it.
CONSTRAINT Bounded

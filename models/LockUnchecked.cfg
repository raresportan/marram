\* The same, without the check after publishing: Mutex must fail, or the model can't find what it is for.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2, p3}
    MaxGen = 10
    Rounds = 2
    VerifyAfterPublish = FALSE
INVARIANT TypeOK
INVARIANT Mutex
\* Numbers grow as processes give way and die; the search stops at MaxGen, and Mutex holds everywhere below it.
CONSTRAINT Bounded
